        grid-template-rows: repeat(4, 1fr);
        gap: var(--gap);
      }

      .grid-row {
        display: contents;
      }

      .cell {
        position: relative;
        border-radius: calc(var(--gap) * 0.82);
        background: var(--cell);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.02), inset 0 -1px 0 var(--cell-edge);

      .cell::after {

      .tile-layer {
        --cell: calc((100% - 3 * var(--gap)) / 4);
        position: absolute;
        inset: var(--gap);
        pointer-events: none;
      }

      .tile {
        --dx: 0;
        --dy: 0;
        position: absolute;
        left: calc(var(--col) * (var(--cell) + var(--gap)));
        top: calc(var(--row) * (var(--cell) + var(--gap)));
        display: grid;
        place-items: center;
        width: var(--cell);
        height: var(--cell);
        border-radius: calc(var(--gap) * 0.82);
        background: var(--tile-bg, #2a2a26);
        color: var(--tile-fg, #f4efe3);
        box-shadow: var(--tile-shadow), 0 0 0 1px var(--tile-edge, rgba(0, 0, 0, 0.06));

        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.04em;
        font-variant-numeric: tabular-nums lining-nums;
        transform: translate(calc(var(--dx) * (100% + var(--gap))), calc(var(--dy) * (100% + var(--gap))));

        will-change: transform;
      }

      html[data-theme='light'] .tile[data-value='1024'] {
        --tile-bg: #ecd693;
        --tile-fg: #2f2307;
        --tile-edge: rgba(90, 64, 10, 0.22);
      }
      html[data-theme='light'] .tile[data-value='2048'] {
        --tile-bg: #f3e4b4;
        --tile-fg: #2a1f05;
        --tile-edge: rgba(120, 84, 12, 0.36);
      }
      html[data-theme='light'] .tile[data-value='4096'] {
        --tile-bg: #2a2a24;
        --tile-fg: #eed69a;
        --tile-edge: rgba(74, 58, 22, 0.4);
      }
      html[data-theme='light'] .tile[data-value='8192'] {
        --tile-bg: #34342c;
        --tile-fg: #f2dfa8;
        --tile-edge: rgba(74, 58, 22, 0.44);
      }
      html[data-theme='light'] .tile.is-beyond {
        --tile-bg: #1e201c;
        --tile-fg: #f7ecc4;
        --tile-edge: rgba(30, 32, 28, 0.5);
      }

      .tile.is-target {
        box-shadow: var(--tile-shadow), 0 0 0 1px rgba(240, 215, 154, 0.5), 0 0 24px rgba(216, 179, 100, 0.16);
      }

      .tile.is-target::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(128deg, transparent 24%, rgba(255, 255, 255, 0.42) 46%, transparent 64%);

        pointer-events: none;
      }

      }

      @keyframes tile-win {
        0% {
          box-shadow: var(--tile-shadow), 0 0 0 1px rgba(240, 215, 154, 0.9), 0 0 0 0 rgba(240, 215, 154, 0.55);
        }
        100% {
          box-shadow: var(--tile-shadow), 0 0 0 1px rgba(240, 215, 154, 0.5), 0 0 0 26px rgba(240, 215, 154, 0);
        }
      }

      /* ------------------------------------------------------------------ *
       * Board meta
       * ------------------------------------------------------------------ */
      .board-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        width: var(--board-size);
        max-width: 100%;
        min-width: 0;
      }

      .undo-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        padding: 0 12px;
        border: 1px solid var(--hairline);
        border-radius: 10px;
        background: var(--panel);
        color: var(--ink);
        font-family: var(--font-ui);
        font-size: clamp(11.5px, 1.55vmin, 13.5px);
        font-weight: 500;
        cursor: pointer;
        transition: border-color 140ms ease, background 140ms ease, opacity 140ms ease;
      }

      .undo-btn:hover:not(:disabled) {
        border-color: var(--hairline-strong);
        background: var(--panel-solid);
      }

      .undo-btn:active:not(:disabled) {
        transform: translateY(1px);
      }

      .undo-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .undo-icon {
        flex: 0 0 auto;
        color: var(--brass);
      }

      .undo-btn:disabled .undo-icon {
        color: var(--ink-faint);
      }

      .undo-count {
        padding-left: 8px;
        border-left: 1px solid var(--hairline);
        font-family: var(--font-mono);
        font-size: clamp(8.5px, 1.15vmin, 10.5px);
        letter-spacing: 0.04em;
        color: var(--brass);
        white-space: nowrap;
      }

      .undo-btn:disabled .undo-count {
        color: var(--ink-faint);
      }

      .meta-right {
        display: flex;
        flex: 1 1 auto;
        align-items: center;
        justify-content: flex-end;
        gap: clamp(6px, 1vmin, 10px);
        min-width: 0;
      }

      .save-indicator {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 6px;
        min-height: 32px;
        padding: 4px 2px;
        border: 0;
        background: none;
        font-family: var(--font-mono);
        font-size: clamp(8px, 1.12vmin, 10px);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink-faint);
        white-space: nowrap;
        cursor: default;
      }

      .save-indicator:disabled {
        opacity: 1;
      }

      .save-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--ink-faint);
        box-shadow: 0 0 0 3px rgba(144, 138, 125, 0.12);

      }

      .save-indicator[data-state='saved'] .save-dot {
        background: var(--ok);
        box-shadow: 0 0 0 3px rgba(157, 195, 169, 0.14);
      }

      .save-indicator[data-state='failed'] {
        color: var(--danger);
        cursor: pointer;
        text-decoration: underline;
        text-decoration-style: dotted;
        text-underline-offset: 3px;
      }

      .save-indicator[data-state='failed'] .save-dot {
        background: var(--danger);
        box-shadow: 0 0 0 3px rgba(232, 137, 122, 0.16);
      }

      @keyframes save-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }

      .meta-divider {
        width: 1px;
        height: 11px;
        background: var(--hairline);
      }

      .meta-hint {
        flex: 0 1 auto;
        min-width: 0;
        overflow: hidden;
        font-size: clamp(9.5px, 1.3vmin, 11.5px);
        line-height: 1.4;
        color: var(--ink-faint);
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .meta-hint.is-alert {
        color: var(--danger);
      }

      .meta-hint.is-brass {
        color: var(--brass);
      }

      /* ------------------------------------------------------------------ *
       * Footer
       * ------------------------------------------------------------------ */
      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding-top: clamp(6px, 1vmin, 10px);
        border-top: 1px solid var(--hairline);
      }

      .keys {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 12px;
        font-size: clamp(9.5px, 1.28vmin, 11.5px);
        color: var(--ink-faint);
      }

      .key-group {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        white-space: nowrap;
      }

      kbd {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 18px;
        height: 19px;
        padding: 0 4px;
        border: 1px solid var(--hairline-strong);
        border-bottom-width: 2px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.035);
        color: var(--ink-soft);
        font-family: var(--font-mono);
        font-size: clamp(8px, 1.02vmin, 9.5px);
        line-height: 1;
      }

      html[data-theme='light'] kbd {
        background: rgba(255, 255, 255, 0.42);
      }

      .key-or {
        opacity: 0.6;
      }

      .key-sep {
        width: 1px;
        height: 11px;
        background: var(--hairline);
      }

      .footer-mark {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 8px;
        font-family: var(--font-mono);
        font-size: clamp(8px, 1.06vmin, 10px);
        letter-spacing: 0.14em;
        color: var(--ink-faint);
        white-space: nowrap;
      }

      .footer-rule {
        width: 24px;
        height: 1px;
        background: var(--hairline-strong);
      }

      /* ------------------------------------------------------------------ *
       * Overlay
       * ------------------------------------------------------------------ */
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        padding: clamp(18px, 4vw, 40px);
        background: var(--overlay-bg);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        animation: overlay-in 180ms ease-out both;
      }

      .overlay.hidden {
        display: none;
      }

      @keyframes overlay-in {
        0% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }

      .overlay-card {
        width: min(430px, 100%);
        padding: clamp(22px, 4vmin, 34px);
        border: 1px solid rgba(216, 179, 100, 0.3);
        border-radius: 18px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.045), transparent 40%), var(--panel-solid);
        box-shadow: 0 40px 110px rgba(0, 0, 0, 0.56), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        text-align: left;

      html[data-theme='light'] .overlay-card {
        box-shadow: 0 34px 90px rgba(58, 44, 22, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.8);
      }

      .overlay-ornament {
        display: flex;
        gap: 5px;
        margin-bottom: clamp(12px, 2vmin, 18px);
      }

      .overlay-ornament span {
        width: 16px;
        height: 2px;
        border-radius: 1px;
        background: var(--brass);
      }

      .overlay-ornament span:nth-child(2) {
        opacity: 0.55;
      }

      .overlay-ornament span:nth-child(3) {
        opacity: 0.25;
      }

      .overlay-kicker {
        margin: 0 0 9px;
        font-family: var(--font-mono);
        font-size: clamp(7.5px, 1.05vmin, 9.5px);
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--brass);
      }

      .overlay-title {
        margin: 0 0 10px;
        font-family: var(--font-display);
        font-size: clamp(25px, 4vmin, 34px);
        font-weight: 600;
        line-height: 1.16;
        letter-spacing: -0.02em;
        color: var(--ink);
        text-wrap: balance;
      }

      .overlay-hint {
        margin: 0 0 18px;
        font-size: clamp(11.5px, 1.5vmin, 13px);
        line-height: 1.7;
        color: var(--ink-soft);
      }

      .overlay-detail {
        margin: -6px 0 18px;
        font-family: var(--font-mono);
        font-size: clamp(9px, 1.2vmin, 11px);
        line-height: 1.6;
        letter-spacing: 0.04em;
        color: var(--brass);
      }

      .overlay-detail.hidden {
        display: none;
      }

      .overlay-detail.is-alert {
        color: var(--danger);
      }

      .overlay-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }

      .primary {
        min-height: 46px;
        padding: 0 22px;
        border: 1px solid var(--brass-strong);
        border-radius: 12px;
        background: linear-gradient(180deg, #ecd8a4, #c9a45a);
        color: #221a09;
        font-family: var(--font-ui);
        font-size: clamp(13px, 1.7vmin, 14px);
        font-weight: 700;
        letter-spacing: 0.01em;
        cursor: pointer;
        box-shadow: 0 10px 24px rgba(216, 179, 100, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.5);
        transition: filter 120ms ease, transform 120ms ease;
      }

      .primary:hover {
        filter: brightness(1.05);
      }

      .primary:active {
        transform: translateY(1px);
      }

      .overlay-footnote {
        margin: clamp(12px, 2vmin, 18px) 0 0;
        font-family: var(--font-mono);
        font-size: clamp(7px, 0.95vmin, 8.5px);
        line-height: 1.5;
        letter-spacing: 0.11em;
        text-transform: uppercase;
        color: var(--ink-faint);
      }

      /* ------------------------------------------------------------------ *
       * Responsive
       * ------------------------------------------------------------------ */
      html[data-embed='true'] .app {
        padding-top: calc(clamp(14px, 2.2vmin, 26px) + 40px);
      }

      /* Keep save/status text clear of the Agent Presence whale (bottom-right). */
      html[data-embed='true'] .board-meta {
        padding-right: 64px;
      }

      html[data-embed='true'] .footer-mark {
        display: none;
      }

      @media (max-height: 760px) {
        html[data-embed='true'] .app {
          padding-top: calc(10px + 44px);
        }
        html[data-embed='true'] .board-meta {
          padding-right: 58px;
        }
        .tagline {
          display: none;
        }
        .app {
          gap: 6px;
          padding-top: 10px;
        }
        .masthead {
          padding-bottom: 8px;
        }
      }

      @media (max-height: 620px) {
        .footer {
          display: none;
        }
        .kicker {
          margin-bottom: 4px;
        }
        .wordmark {
          font-size: clamp(32px, 6.4vmin, 54px);
        }
      }

      @media (max-width: 640px) {
        .app {
          padding-right: 12px;
          padding-left: 12px;
        }
        .masthead {
          gap: 10px;
        }
        .kicker {
          font-size: 7px;
          letter-spacing: 0.14em;
        }
        .tagline {
          display: none;
        }
        .ledger {
          gap: 5px;
        }
        .stat {
          min-width: 50px;
          padding: 5px 7px 4px;
        }
        .stat-note {
          display: none;
        }
        .stat-value {
          font-size: clamp(15px, 3.4vw, 20px);
        }
        .stat-label {
          letter-spacing: 0.12em;
        }
        .board-meta {
          gap: 6px;
        }
        .undo-btn {
          padding: 0 9px;
          gap: 6px;
        }
        .undo-label {
          display: none;
        }
        .meta-divider {
          display: none;
        }
        .meta-hint {
          font-size: 9px;
        }
        .keys {
          gap: 3px 8px;
        }
        .footer-mark {
          display: none;
        }
        .overlay-card {
          width: 100%;
        }
      }

      @media (max-width: 480px) {
        .masthead {
          flex-direction: column;
          align-items: stretch;
          gap: 8px;
        }
        .ledger {
          justify-content: flex-start;
        }
        .stat {
          flex: 1 1 0;
        }
        .wordmark {
          font-size: clamp(34px, 12vw, 52px);
        }
        .keys {
          gap: 3px 6px;
        }
        .key-sep,
        .key-or {
          display: none;
        }
      }

      /* ------------------------------------------------------------------ *
       * Motion preferences
       * ------------------------------------------------------------------ */
      html[data-reduced-motion='true'] .tile,
      html[data-reduced-motion='true'] .undo-btn,
      html[data-reduced-motion='true'] .stat,
      html[data-reduced-motion='true'] .primary,
      html[data-reduced-motion='true'] .overlay {
        transition: none !important;
        animation: none !important;
      }

      html[data-reduced-motion='true'] .tile.is-spawn .tile-face,
      html[data-reduced-motion='true'] .tile.is-merge .tile-face,
      html[data-reduced-motion='true'] .tile.is-win,
      html[data-reduced-motion='true'] .board.is-bumped,
      html[data-reduced-motion='true'] .score-delta.show {

        .tile.is-merge .tile-face,
        .tile.is-win,
        .board.is-bumped,
        .score-delta.show {
          animation: none !important;
        }
      }

  <body>
    <div class="app" id="app">
      <div class="ambient ambient-brass" aria-hidden="true"></div>
      <div class="ambient ambient-jade" aria-hidden="true"></div>

      <header class="masthead">
        <div class="identity">
          <p class="kicker">
            <span class="kicker-mark" aria-hidden="true"></span>
            <span>DSH Game Market</span>
            <span class="kicker-sep">/</span>
            <span>Puzzle No. 2048</span>
          </p>
          <h1 class="wordmark">2048<span class="wordmark-tick" aria-hidden="true"></span></h1>
          <p class="tagline">把相同的数字，推到一起。</p>
        </div>
        <div class="ledger" role="group" aria-label="计分板">
          <div class="stat" id="score-stat">
            <span class="stat-label">SCORE</span>
            <span class="stat-value" id="score">0</span>
            <span class="score-delta" id="score-delta" aria-hidden="true"></span>
          </div>
          <div class="stat stat-best" id="best-stat">
            <span class="stat-label">BEST</span>
            <span class="stat-value" id="best">0</span>
            <span class="stat-note" id="best-note">PERSONAL</span>
          </div>
          <div class="stat stat-moves" id="moves-stat">
            <span class="stat-label">MOVES</span>
            <span class="stat-value" id="moves">0</span>
          </div>
        </div>
      </header>

      <main class="board-zone" id="board-zone">
        <div class="board-frame" id="board-frame">
          <div
            class="board"
            id="board"
            tabindex="0"
            role="grid"
            aria-rowcount="4"
            aria-colcount="4"
            aria-label="2048 棋盘，4 行 4 列"
            aria-describedby="board-help"
            aria-keyshortcuts="ArrowUp ArrowDown ArrowLeft ArrowRight W A S D P U Enter"
          >
            <div class="board-grid" id="board-grid"></div>
            <div class="tile-layer" id="tile-layer" aria-hidden="true"></div>
          </div>
          <div class="board-meta" id="board-meta">
            <button id="undo" class="undo-btn" type="button" disabled>
              <svg class="undo-icon" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
                <path
                  d="M7.6 4.6 4 8.2l3.6 3.6M4.5 8.2h6.1a4.7 4.7 0 0 1 4.7 4.7v1.2"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <span class="undo-label">撤销</span>
              <span class="undo-count" id="undo-count">剩 1 次</span>
            </button>
            <div class="meta-right">
              <button id="save-indicator" class="save-indicator" type="button" data-state="idle" disabled>
                <span class="save-dot" aria-hidden="true"></span>
                <span id="save-text">未保存</span>
              </button>
              <span class="meta-divider" aria-hidden="true"></span>
              <span class="meta-hint" id="status-line">方向键或 WASD 开始</span>
            </div>
          </div>
          <p id="board-help" class="sr-only">
            使用方向键或 WASD 滑动棋盘，相同数字合并。按 P 暂停或继续，按 U 撤销一次，按回车开始或重开。斜向滑动手势也可以操作棋盘。
          </p>
        </div>
      </main>

      <footer class="footer">
        <div class="keys" aria-hidden="true">
          <span class="key-group"><kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd></span>
          <span class="key-or">或</span>
          <span class="key-group"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span>
          <span class="key-sep"></span>
          <span class="key-group"><kbd>P</kbd> 暂停</span>
          <span class="key-group"><kbd>U</kbd> 撤销</span>
          <span class="key-group"><kbd>↵</kbd> 开始 / 重开</span>
        </div>
        <div class="footer-mark">
          <span class="footer-rule" aria-hidden="true"></span>
          <span>No. 2048 · v1.0.0</span>
        </div>
      </footer>

      <div
        id="overlay"
        class="overlay hidden"
        role="dialog"
        aria-modal="false"
        aria-labelledby="overlay-title"
        aria-describedby="overlay-hint"
      >
        <div class="overlay-card">
          <div class="overlay-ornament" aria-hidden="true"><span></span><span></span><span></span></div>
          <p id="overlay-kicker" class="overlay-kicker">2048</p>
          <h2 id="overlay-title" class="overlay-title">把相同的数字推到一起</h2>
          <p id="overlay-hint" class="overlay-hint">方向键 / WASD 滑动 · 每局一次撤销</p>
          <p id="overlay-detail" class="overlay-detail hidden"></p>
          <div id="overlay-actions" class="overlay-actions">
            <button id="primary" class="primary" type="button">开始游戏</button>
          </div>
          <p id="overlay-footnote" class="overlay-footnote">进度会自动保存 · 离开后可继续</p>
        </div>
      </div>

      <div id="live-region" class="sr-only" role="status" aria-live="polite"></div>
    </div>

    if ((runtime.theme === 'light' || runtime.theme === 'dark') && runtime.theme !== currentTheme) {
      currentTheme = runtime.theme;
      renderer.setTheme(currentTheme);
    }
    if (typeof runtime.reducedMotion === 'boolean' && runtime.reducedMotion !== reducedMotion) {
      reducedMotion = runtime.reducedMotion;
      renderer.setReducedMotion(reducedMotion);
    }
  }

  function refreshHud() {
    if (!state) return;
    renderer.setScores({
      score: state.score,
      best: displayBest(),
      moves: state.moves,
      record: isRecord(),
    });
    renderer.setUndo({
      remaining: undoAllowance(state),
      enabled: mode === 'playing' && !runtimePaused && canUndo(state),
    });
  }

  function updateStatus() {
    if (mode === 'ready') {
      renderer.setStatus(restoredSave ? '已恢复上一局 · 按方向键继续' : '按方向键 / 回车开始', restoredSave ? 'brass' : '');
    } else if (mode === 'playing') {
      renderer.setStatus(state && state.reached2048 ? '已达成 2048 · 继续冲分' : '方向键 / WASD 滑动', state && state.reached2048 ? 'brass' : '');
    } else if (mode === 'paused') {
      renderer.setStatus(runtimePaused ? '平台已暂停 · 请在平台菜单中继续' : '已暂停 · 按 P 继续');
    } else if (mode === 'won') {
      renderer.setStatus('达成 2048 · 选择继续', 'brass');
    } else if (mode === 'over') {
      renderer.setStatus('本局结束 · 按回车再来一局');
    } else if (mode === 'error') {
      renderer.setStatus('无法启动', 'alert');
    } else {
      renderer.setStatus('正在准备…');
    }
  }

  function startSession() {
    if (sessionActive) return;
    sessionActive = true;
    Promise.resolve()
      .then(function () {
        return game.session.start();
      })
      .catch(function () {
        sessionActive = false;
      });
  }

  function loadBest() {
    return Promise.resolve()
      .then(function () {
        return game.score.getBest();
      })
      .then(function (result) {
        if (result && Number.isFinite(result.score) && result.score >= 0) return Math.floor(result.score);
        return 0;
      })
      .catch(function () {
        return 0;
      });
  }

  function loadSavedState() {
    return Promise.resolve()
      .then(function () {
        return game.storage.load('current');
      })
      .then(function (saved) {
        return { saved, error: null };
      })
      .catch(function (error) {
        return { saved: null, error };
      });
  }

  function scheduleSave(delayMs) {
    if (!state || mode === 'boot' || mode === 'error') return;
    clearSaveTimer();
    const delay = typeof delayMs === 'number' ? delayMs : 450;
    saveTimer = win.setTimeout(function flushScheduledSave() {
      saveTimer = null;
      saveNow();
    }, delay);
  }

  function saveNow() {
    if (!state || mode === 'boot' || mode === 'error') return Promise.resolve(null);
    clearSaveTimer();
    syncElapsed();
    const payload = serialize(state);
    const seq = (saveSeq += 1);
    lastSaveState = 'saving';
    renderer.setSaveStatus('saving');
    return Promise.resolve()
      .then(function () {
        return game.storage.save('current', payload);
      })
      .then(function (result) {
        if (seq === saveSeq) {
          const recovered = lastSaveFailed;
          lastSaveState = 'saved';
          lastSaveFailed = false;
          renderer.setSaveStatus('saved');
          if (recovered) updateStatus();
        }
        return result;
      })
      .catch(function (error) {
        if (seq === saveSeq) {
          lastSaveState = 'failed';
          lastSaveFailed = true;
          const code = errorCode(error);
          renderer.setSaveStatus('failed', code);
          renderer.setStatus(`保存失败 ${code} · 点击「重试保存」`, 'alert');
          renderer.announce(`保存失败 ${code}`);
        }
        return null;
      });
  }

  function showReadyOverlay(notice) {
    if (restoredSave && state) {
      renderer.showOverlay({
        kicker: '已恢复上一局',
        title: '继续这一局',
        hint: '棋盘、分数和步数都已恢复。按方向键或回车继续。',
        detail: notice || `得分 ${formatNumber(state.score)} · 步数 ${state.moves} · 最高方块 ${highestTile(state.board) || '无'}`,
        detailTone: notice ? 'alert' : '',
        primaryLabel: '继续游戏',
        onPrimary: function onContinue() {
          startPlaying(true);
        },
        footnote: '平台确认后即可继续 · 进度已自动保存',
      });
      return;
    }
    renderer.showOverlay({
      kicker: '数字拼图',
      title: '把相同的数字推到一起',
      hint: '方向键 / WASD 滑动棋盘，相同数字合并。每局可以撤销一次，达成 2048 后还能继续冲分。',
      detail: notice || '',
      detailTone: notice ? 'alert' : '',
      primaryLabel: '开始游戏',
      onPrimary: function onStart() {
        startPlaying(false);
      },
      footnote: '进度会自动保存 · 离开后可继续',
    });
  }

  function showWinOverlay() {
    renderer.showOverlay({
      kicker: '达成 2048',
      title: '2048 达成',
      hint: '更强的数字还在后面。按回车继续冲分，看看能走多远。',
      detail: `得分 ${formatNumber(state.score)} · 步数 ${state.moves} · 最高方块 ${highestTile(state.board)}`,
      primaryLabel: '继续游戏',
      onPrimary: continueWin,
      footnote: '继续后仍可挑战 4096 · 分数在结束时提交',
    });
  }

  function showLocalPauseOverlay() {
    renderer.showOverlay({
      kicker: '已暂停',
      title: '喘口气',
      hint: '按 P 或回车继续。暂停的时间不会计入本局用时。',
      detail: `得分 ${formatNumber(state.score)} · 步数 ${state.moves}`,
      primaryLabel: '继续',
      onPrimary: resumeLocal,
      footnote: '进度已自动保存',
    });
  }

  function showPlatformPauseOverlay() {
    renderer.showOverlay({
      kicker: '已暂停',
      title: '平台暂停中',
      hint: '请在平台的暂停菜单中点击「继续」，游戏会从当前棋盘恢复。',
      detail: '',
      primaryLabel: '',
      onPrimary: null,
      footnote: false,
    });
  }

  function showGameOverOverlay(fromSave) {
    const record = !fromSave && state.score > bestAtGameStart && state.score > 0;
    renderer.showOverlay({
      kicker: '本局结束',
      title: `得分 ${formatNumber(state.score)}`,
      hint: `没有可以移动的方向了 · 最高方块 ${highestTile(state.board)}`,
      detail: fromSave
        ? '这局已经结束 · 分数已在上一局提交'
        : record
          ? '新纪录 · 分数已提交'
          : `个人最高 ${formatNumber(best)}`,
      primaryLabel: '再来一局',
      onPrimary: restart,
      footnote: fromSave ? '按回车开始新的一局' : '按回车重开 · 分数只会提交一次',
    });
  }

  function showFatal(error) {
    mode = 'error';
    const code = errorCode(error);
    renderer.setStatus('无法启动', 'alert');
    renderer.setUndo({ remaining: 0, enabled: false });
    renderer.setSaveStatus('idle');
    renderer.showOverlay({
      kicker: '无法开始',
      title: '游戏暂时不可用',
      hint: `${errorMessage(error)} · ${code}`,
      primaryLabel: '重新加载',
      onPrimary: function reloadPage() {
        try {
          win.location.reload();
        } catch (_reloadError) {
          // The host error overlay offers the final recovery path.
        }
      },
      footnote: '如果问题持续，请返回游戏市场后重试。',
    });
    renderer.announce(`游戏无法启动 ${code}`);
  }

  function startPlaying(fromResume) {
    if (mode !== 'ready' && mode !== 'paused') return;
    const wasRestored = restoredSave;
    restoredSave = false;
    if (state.status === 'ready') state = beginPlay(state);
    mode = 'playing';
    runtimePaused = false;
    pausedFromMode = null;
    renderer.hideOverlay();
    renderer.renderBoard(state.board, { instant: true });
    startSession();
    lastActiveAt = now();
    renderer.focusBoard();
    refreshHud();
    updateStatus();
    if (wasRestored) {
      renderer.announce(fromResume ? '已恢复上一局，继续游戏' : '已恢复上一局');
    }
  }

  function resumeLocal() {
    if (mode !== 'paused' || runtimePaused) return;
    mode = 'playing';
    renderer.hideOverlay();
    lastActiveAt = now();
    renderer.focusBoard();
    refreshHud();
    updateStatus();
  }

  function toggleLocalPause() {
    if (runtimePaused || mode !== 'playing') return;
    syncElapsed();
    mode = 'paused';
    saveNow();
    showLocalPauseOverlay();
    refreshHud();
    updateStatus();
  }

  function undoMove() {
    if (mode !== 'playing' || runtimePaused) return;
    if (!state || !canUndo(state)) {
      renderer.bumpBoard();
      return;
    }
    syncElapsed();
    const result = undo(state);
    if (!result.undone) return;
    state = result.state;
    renderer.renderBoard(state.board, { instant: true });
    renderer.bumpBoard();
    refreshHud();
    updateStatus();
    renderer.announce('已撤销上一步，本局撤销机会已用完');
    scheduleSave(0);
  }

  function buildMoveAnnouncement(result) {
    const parts = [];
    if (result.scoreGained > 0) parts.push(`合并 +${result.scoreGained}`);
    parts.push(`得分 ${state.score}`);
    parts.push(`最高方块 ${highestTile(state.board)}`);
    if (result.reachedTarget) parts.push('达成 2048');
    if (state.status === 'over') parts.push('没有可移动的方向');
    return parts.join('，');
  }

  function applyDirection(direction) {
    const resolved = normalizeDirection(direction);
    if (!resolved || !state) return;
    if (mode === 'ready') startPlaying(false);
    if (mode !== 'playing' || runtimePaused) return;
    syncElapsed();
    const result = move(state, resolved);
    if (!result.moved) {
      renderer.bumpBoard();
      renderer.announce('这个方向没有可以移动的方块');
      return;
    }
    state = result.state;
    renderer.renderBoard(state.board, {
      slides: result.slides,
      merges: result.merges,
      spawned: result.spawned,
      win: result.reachedTarget,
    });
    renderer.flashScoreDelta(result.scoreGained);
    refreshHud();
    updateStatus();
    renderer.announce(buildMoveAnnouncement(result));
    if (state.status === 'won') {
      onWin();
      return;
    }
    if (state.status === 'over') {
      onGameOver();
      return;
    }
    scheduleSave();
  }

  function submitFinalScore(finalScore) {
    Promise.resolve()
      .then(function () {
        return game.score.submit(finalScore);
      })
      .then(function (result) {
        if (result && Number.isFinite(result.best)) best = Math.max(best, Math.floor(result.best));
        else best = Math.max(best, finalScore);
        refreshHud();
        renderer.announce('分数已提交');
      })
      .catch(function (error) {
        const code = errorCode(error);
        if (mode === 'over') {
          renderer.setStatus(`分数提交失败 ${code} · 可重开一局`, 'alert');
        }
        renderer.announce(`分数提交失败 ${code}`);
      });
  }

  function endSession(finalScore) {
    if (!sessionActive) return;
    sessionActive = false;
    Promise.resolve()
      .then(function () {
        return game.session.end({ outcome: 'completed', score: finalScore });
      })
      .catch(function (error) {
        if (mode === 'over') renderer.setStatus(`结算请求失败 ${errorCode(error)}`, 'alert');
      });
  }

  function onWin() {
    mode = 'won';
    syncElapsed();
    saveNow();
    showWinOverlay();
    refreshHud();
    updateStatus();
    renderer.announce('达成 2048，可以继续游戏');
  }

  function continueWin() {
    if (mode !== 'won') return;
    state = continueAfterWin(state);
    renderer.hideOverlay();
    if (state.status === 'over') {
      onGameOver();
      return;
    }
    mode = 'playing';
    lastActiveAt = now();
    renderer.focusBoard();
    refreshHud();
    updateStatus();
    renderer.announce('继续游戏');
    scheduleSave();
  }

  function onGameOver() {
    if (mode === 'over' && overHandled) return;
    mode = 'over';
    overHandled = true;
    syncElapsed();
    renderer.renderBoard(state.board, { instant: true });
    showGameOverOverlay(false);
    refreshHud();
    updateStatus();
    saveNow();
    renderer.announce(`本局结束，得分 ${state.score}`);
    if (!scoreSubmittedForGame) {
      scoreSubmittedForGame = true;
      const finalScore = state.score;
      submitFinalScore(finalScore);
      endSession(finalScore);
    }
  }

  function restart() {
    state = beginPlay(createGame({ seed: makeSeed() }));
    mode = 'playing';
    restoredSave = false;
    runtimePaused = false;
    pausedFromMode = null;
    overHandled = false;
    scoreSubmittedForGame = false;
    bestAtGameStart = best;
    renderer.hideOverlay();
    renderer.renderBoard(state.board, { instant: true });
    startSession();
    lastActiveAt = now();
    renderer.focusBoard();
    refreshHud();
    updateStatus();
    renderer.announce('新的一局开始');
    saveNow();
  }

  function onRuntimePause() {
    if (!booted) {
      runtimePaused = true;
      return;
    }
    if (mode === 'over' || mode === 'error') {
      runtimePaused = true;
      return;
    }
    if (runtimePaused) return;
    runtimePaused = true;
    if (mode === 'playing') syncElapsed();
    pausedFromMode = mode;
    mode = 'paused';
    saveNow();
    renderer.hideOverlay();
    refreshHud();
    updateStatus();
  }

  function onRuntimeResume() {
    if (!booted) {
      runtimePaused = false;
      resumeRequested = true;
      return;
    }
    runtimePaused = false;
    if (mode === 'over' || mode === 'error') {
      lastActiveAt = now();
      return;
    }
    if (mode !== 'paused') {
      lastActiveAt = now();
      return;
    }
    const previous = pausedFromMode || 'playing';
    pausedFromMode = null;
    if (previous === 'paused') {
      mode = 'paused';
      showLocalPauseOverlay();
      refreshHud();
      updateStatus();
      return;
    }
    if (previous === 'ready') {
      mode = 'ready';
      if (restoredSave) {
        startPlaying(true);
        return;
      }
      showReadyOverlay();
      refreshHud();
      updateStatus();
      return;
    }
    if (previous === 'won') {
      mode = 'won';
      showWinOverlay();
      refreshHud();
      updateStatus();
      return;
    }
    mode = 'playing';
    if (state.status === 'ready') state = beginPlay(state);
    renderer.hideOverlay();
    lastActiveAt = now();
    renderer.focusBoard();
    refreshHud();
    updateStatus();
    saveNow();
  }

  function onHidden() {
    syncElapsed(true);
    saveNow();
  }

  function onVisible() {
    lastActiveAt = now();
  }

  function onBeforeSave() {
    syncElapsed();
    return saveNow();
  }

  function onVisibilityChange() {
    if (doc.hidden) onHidden();
    else onVisible();
  }

  function onWindowBlur() {
    syncElapsed();
    windowBlurred = true;
  }

  function onWindowFocus() {
    windowBlurred = false;
    lastActiveAt = now();
  }

  function onPageHide() {
    syncElapsed(true);
    saveNow();
  }

  function isSpaceKey(event, key) {
    return key === ' ' || key === 'Spacebar' || event.code === 'Space';
  }

  function handleKeydown(event) {
    if (!event || typeof event.key !== 'string') return;
    if (event.ctrlKey || event.metaKey || event.altKey) return;
    if (mode === 'boot' || mode === 'error') return;
    const key = event.key;
    const lower = key.toLowerCase();
    const space = isSpaceKey(event, key);
    const enter = key === 'Enter';
    const direction = normalizeDirection(key);

    if (runtimePaused) {
      if (direction || lower === 'p' || enter || space) event.preventDefault();
      return;
    }

    if (mode === 'ready') {
      if (direction) {
        event.preventDefault();
        startPlaying(false);
        applyDirection(direction);
        return;
      }
      if (enter || space) {
        event.preventDefault();
        if (!event.repeat) startPlaying(false);
        return;
      }
      return;
    }

    if (mode === 'paused') {
      if (lower === 'p' || enter || space) {
        event.preventDefault();
        if (!event.repeat) resumeLocal();
        return;
      }
      if (direction) event.preventDefault();
      return;
    }

    if (mode === 'won') {
      if (enter || space) {
        event.preventDefault();
        if (!event.repeat) continueWin();
      }
      return;
    }

    if (mode === 'over') {
      if (enter || space) {
        event.preventDefault();
        if (!event.repeat) restart();
      }
      return;
    }

    if (mode !== 'playing') return;

    if (direction) {
      event.preventDefault();
      applyDirection(direction);
      return;
    }
    if (lower === 'p') {
      event.preventDefault();
      if (!event.repeat) toggleLocalPause();
      return;
    }
    if (lower === 'u') {
      event.preventDefault();
      if (!event.repeat) undoMove();
    }
  }

  function handleSwipe(direction) {
    if (runtimePaused) return;
    if (mode === 'ready') {
      startPlaying(false);
      applyDirection(direction);
      return;
    }
    if (mode === 'playing') applyDirection(direction);
  }

  function bindEvents() {
    win.addEventListener('keydown', handleKeydown);
    win.addEventListener('blur', onWindowBlur);
    win.addEventListener('focus', onWindowFocus);
    win.addEventListener('pagehide', onPageHide);
    doc.addEventListener('visibilitychange', onVisibilityChange);
    renderer.onUndo(undoMove);
    renderer.onSaveRetry(function retrySave() {
      saveNow();
    });
    renderer.onSwipe(handleSwipe);
    game.lifecycle.on('pause', onRuntimePause);
    game.lifecycle.on('resume', onRuntimeResume);
    game.lifecycle.on('hidden', onHidden);
    game.lifecycle.on('visible', onVisible);
    game.lifecycle.on('before-save', onBeforeSave);
  }

  async function boot() {
    renderer.init();
    bindEvents();
    renderer.showOverlay({
      kicker: '载入中',
      title: '正在准备棋盘',
      hint: '正在连接游戏运行时…',
      footnote: false,
    });

    try {
      const info = await game.ready();
      applyRuntime(info);
      if (info.launchMode === 'resume-paused') runtimePaused = true;
      best = await loadBest();
      bestAtGameStart = best;
      const loaded = await loadSavedState();
      const restored = loaded.saved ? deserialize(loaded.saved.data) : null;
      let bootNotice = null;
      if (loaded.error) bootNotice = `存档读取失败 ${errorCode(loaded.error)} · 已开始新局`;
      else if (loaded.saved && !restored) bootNotice = '存档不可用 · 已开始新局';
      booted = true;

      if (restored) {
        state = restored;
        restoredSave = true;
        renderer.renderBoard(state.board, { instant: true });
        if (restored.status === 'over') {
          mode = 'over';
          overHandled = true;
          scoreSubmittedForGame = true;
          renderer.hideOverlay();
          showGameOverOverlay(true);
          refreshHud();
          updateStatus();
        } else if (restored.status === 'won') {
          mode = 'won';
          showWinOverlay();
          refreshHud();
          updateStatus();
        } else {
          mode = 'ready';
          showReadyOverlay(bootNotice);
          refreshHud();
          updateStatus();
        }
      } else {
        state = createGame({ seed: makeSeed() });
        mode = 'ready';
        renderer.renderBoard(state.board, { instant: true });
        showReadyOverlay(bootNotice);
        refreshHud();
        updateStatus();
      }

      if (mode !== 'over') startSession();

      if (runtimePaused && mode !== 'over' && mode !== 'error') {
        pausedFromMode = mode;
        mode = 'paused';
        renderer.hideOverlay();
        refreshHud();
        updateStatus();
      } else if (resumeRequested && !runtimePaused && mode === 'ready' && restoredSave) {
        resumeRequested = false;
        startPlaying(true);
      } else if (resumeRequested && !runtimePaused && mode === 'won') {
        resumeRequested = false;
        showWinOverlay();
      }
      resumeRequested = false;

      renderer.setSaveStatus(restored ? 'saved' : 'idle');
      lastActiveAt = now();
      runtimeWatchTimer = win.setInterval(watchRuntime, 1800);
      renderer.announce('2048 已就绪');
      if (bootNotice) {
        renderer.setStatus(bootNotice, 'alert');
        renderer.announce(bootNotice);
      }
    } catch (error) {
      booted = true;
      showFatal(error);
    }
  }

  if (typeof window !== 'undefined') {
    window.__dsh2048Debug = function __dsh2048Debug() {
      return {
        mode,
        runtimePaused,
        restoredSave,
        sessionActive,
        offline: offlineMode,
        status: state ? state.status : null,
        score: state ? state.score : 0,
        moves: state ? state.moves : 0,
        best: displayBest(),
        board: state ? state.board.slice() : [],
        undoRemaining: state ? undoAllowance(state) : 0,
        undoReady: state ? canUndo(state) : false,
        elapsed: state ? state.elapsed : 0,
        theme: currentTheme,
        reducedMotion,
        overlay: renderer.isOverlayOpen(),
        saveState: lastSaveState,
        saveFailed: lastSaveFailed,
        saveTimer: saveTimer !== null,
        runtimeWatch: runtimeWatchTimer !== null,
      };
    };
    window.addEventListener('error', function onWindowError() {
      // The player sees failures through the save indicator and status line; do
      // not swallow them into a hidden console-only state.
      if (mode === 'playing') {
        renderer.setStatus('出现异常 · 进度会自动保存', 'alert');
      }
    });
  }

  boot();

  return {};
  })();

  const __entry = __mods["games/2048/src/game.js"];

  return __entry;
})();</script>
